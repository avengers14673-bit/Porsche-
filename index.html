<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Car Engine Simulator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #202020 0%, #080808 55%, #000 100%);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    width: min(92%, 430px);
    text-align: center;
    padding: 28px 20px;
    border: 1px solid #333;
    border-radius: 24px;
    background: rgba(10,10,10,.88);
    box-shadow: 0 0 40px rgba(255,255,255,.08);
}

h1 {
    margin: 0 0 8px;
    font-size: 28px;
    letter-spacing: 2px;
}

.subtitle {
    color: #999;
    font-size: 13px;
    margin-bottom: 25px;
}

.rpm {
    font-size: 58px;
    font-weight: bold;
    letter-spacing: 3px;
}

.label {
    color: #888;
    font-size: 12px;
    letter-spacing: 3px;
}

.bar {
    width: 100%;
    height: 12px;
    background: #222;
    border-radius: 20px;
    margin: 22px 0;
    overflow: hidden;
}

.fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #555, #fff);
    transition: width .05s linear;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    border: 1px solid #444;
    border-radius: 12px;
    background: #171717;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #292929;
}

button.active {
    background: #eee;
    color: #000;
}

.mode-row {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 8px;
    margin-top: 10px;
}

.mode-row button {
    margin-top: 0;
    padding: 11px 5px;
    font-size: 12px;
}

.status {
    margin-top: 18px;
    color: #888;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <h1>SPORTS CAR ENGINE</h1>
    <div class="subtitle">Synthetic High-Performance Engine Simulator</div>

    <div class="rpm" id="rpm">800</div>
    <div class="label">RPM</div>

    <div class="bar">
        <div class="fill" id="rpmBar"></div>
    </div>

    <button id="startBtn">START ENGINE</button>
    <button id="revBtn">REV ENGINE</button>

    <div class="mode-row">
        <button class="mode active" data-mode="normal">NORMAL</button>
        <button class="mode" data-mode="sport">SPORT</button>
        <button class="mode" data-mode="track">TRACK</button>
    </div>

    <div class="status" id="status">
        Engine OFF
    </div>

</div>

<script>
let audioCtx;
let masterGain;
let engineOsc;
let harmonicOsc;
let filter;

let engineRunning = false;
let rpm = 800;
let targetRPM = 800;
let mode = "normal";
let revTimeout;

const rpmDisplay = document.getElementById("rpm");
const rpmBar = document.getElementById("rpmBar");
const startBtn = document.getElementById("startBtn");
const revBtn = document.getElementById("revBtn");
const statusText = document.getElementById("status");

function createEngine() {

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0;

    filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 1200;
    filter.Q.value = 1.2;

    engineOsc = audioCtx.createOscillator();
    engineOsc.type = "sawtooth";

    harmonicOsc = audioCtx.createOscillator();
    harmonicOsc.type = "square";

    engineOsc.connect(filter);
    harmonicOsc.connect(filter);

    filter.connect(masterGain);
    masterGain.connect(audioCtx.destination);

    engineOsc.start();
    harmonicOsc.start();

    updateSound();
}

function updateSound() {

    if (!audioCtx) return;

    let baseFreq = rpm / 60;

    // Sports-car style harmonic engine character
    let engineFrequency = baseFreq * 8;

    if (mode === "sport") {
        engineFrequency *= 1.15;
    }

    if (mode === "track") {
        engineFrequency *= 1.28;
    }

    engineOsc.frequency.setTargetAtTime(
        engineFrequency,
        audioCtx.currentTime,
        0.025
    );

    harmonicOsc.frequency.setTargetAtTime(
        engineFrequency * 2.01,
        audioCtx.currentTime,
        0.025
    );

    let cutoff = 700 + (rpm / 9000) * 4500;

    if (mode === "sport") cutoff *= 1.15;
    if (mode === "track") cutoff *= 1.35;

    filter.frequency.setTargetAtTime(
        cutoff,
        audioCtx.currentTime,
        0.04
    );

    if (engineRunning) {

        let volume = 0.055 + (rpm / 9000) * 0.12;

        if (mode === "sport") volume *= 1.15;
        if (mode === "track") volume *= 1.3;

        masterGain.gain.setTargetAtTime(
            volume,
            audioCtx.currentTime,
            0.06
        );
    }
}

function animateEngine() {

    if (!engineRunning) return;

    rpm += (targetRPM - rpm) * 0.075;

    if (Math.abs(targetRPM - rpm) < 5) {
        rpm = targetRPM;
    }

    rpmDisplay.textContent = Math.round(rpm);

    let percentage = ((rpm - 800) / (9000 - 800)) * 100;

    rpmBar.style.width =
        Math.max(0, Math.min(100, percentage)) + "%";

    updateSound();

    requestAnimationFrame(animateEngine);
}

startBtn.addEventListener("click", async () => {

    if (!audioCtx) {
        createEngine();
    }

    if (audioCtx.state === "suspended") {
        await audioCtx.resume();
    }

    if (!engineRunning) {

        engineRunning = true;
        targetRPM = 1100;

        masterGain.gain.setTargetAtTime(
            0.07,
            audioCtx.currentTime,
            0.3
        );

        startBtn.textContent = "STOP ENGINE";
        statusText.textContent = "Engine RUNNING";

        animateEngine();

    } else {

        engineRunning = false;
        targetRPM = 800;

        masterGain.gain.setTargetAtTime(
            0,
            audioCtx.currentTime,
            0.25
        );

        startBtn.textContent = "START ENGINE";
        statusText.textContent = "Engine OFF";

        rpm = 800;
        rpmDisplay.textContent = "800";
        rpmBar.style.width = "0%";
    }
});

revBtn.addEventListener("click", async () => {

    if (!engineRunning) return;

    if (audioCtx.state === "suspended") {
        await audioCtx.resume();
    }

    clearTimeout(revTimeout);

    targetRPM =
        mode === "normal" ? 6500 :
        mode === "sport" ? 7600 :
        8500;

    statusText.textContent = "REVVING...";

    revTimeout = setTimeout(() => {

        targetRPM =
            mode === "normal" ? 1100 :
            mode === "sport" ? 1300 :
            1500;

        statusText.textContent = "Engine RUNNING";

    }, 1100);
});

document.querySelectorAll(".mode").forEach(button => {

    button.addEventListener("click", () => {

        document.querySelectorAll(".mode")
            .forEach(b => b.classList.remove("active"));

        button.classList.add("active");

        mode = button.dataset.mode;

        statusText.textContent =
            "Mode: " + mode.toUpperCase();

        updateSound();
    });
});

</script>

</body>
</html>
