<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Driven By Dreams</title>

    <style>

        /* ================= BASIC ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }


        /* ================= HERO ================= */

        .hero {
            min-height: 100vh;

            display: flex;
            align-items: center;

            padding: 0 8%;

            position: relative;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 80% 50%,
                    rgba(220, 0, 0, 0.25),
                    transparent 35%
                ),
                #050505;
        }


        /* ================= HERO CONTENT ================= */

        .hero-content {
            position: relative;
            z-index: 2;
        }


        .small-text {
            color: #999;

            font-size: 12px;

            letter-spacing: 5px;

            margin-bottom: 25px;
        }


        .hero h1 {
            font-size: clamp(55px, 9vw, 120px);

            line-height: 0.9;

            letter-spacing: 4px;
        }


        .hero h1 span {
            color: #e00000;
        }


        .tagline {
            margin-top: 25px;

            color: #aaa;

            letter-spacing: 7px;

            font-size: 13px;
        }


        /* ================= BUTTONS ================= */

        .buttons {
            display: flex;

            gap: 15px;

            margin-top: 40px;
        }


        .buttons a {
            padding: 15px 25px;

            text-decoration: none;

            color: white;

            border: 1px solid #e00000;

            font-size: 11px;

            letter-spacing: 2px;

            transition: 0.3s;
        }


        .buttons a:first-child {
            background: #e00000;
        }


        .buttons a:hover {
            background: white;

            color: black;

            border-color: white;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .hero {
                min-height: 100vh;

                padding: 0 7%;

                text-align: center;

                justify-content: center;
            }


            .hero h1 {
                font-size: 58px;
            }


            .small-text {
                font-size: 10px;

                letter-spacing: 4px;
            }


            .tagline {
                font-size: 10px;

                letter-spacing: 4px;
            }


            .buttons {
                justify-content: center;

                flex-wrap: wrap;
            }


            .buttons a {
                padding: 13px 18px;
            }

        }

    </style>

</head>


<body>


    <!-- ================= HERO ================= -->

    <section class="hero" id="home">

        <div class="hero-content">

            <p class="small-text">
                PORSCHE EXPERIENCE
            </p>


            <h1>
                DRIVEN<br>
                <span>BY DREAMS.</span>
            </h1>


            <p class="tagline">
                MORE THAN A CAR.
            </p>


            <div class="buttons">

                <a href="#machine">
                    EXPLORE THE DRIVE
                </a>


                <a href="#connect">
                    CONNECT
                </a>

            </div>

        </div>

    </section>


    <!-- Temporary sections so buttons have targets -->

    <section id="machine" style="height:100vh; padding:100px 8%;">
        <h2>THE MACHINE</h2>
    </section>


    <section id="connect" style="height:100vh; padding:100px 8%;">
        <h2>CONNECT</h2>
    </section>


</body>

</html>
