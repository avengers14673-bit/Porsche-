<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PORSCHE — Night Drive</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

/* MAIN SCREEN */

.hero{
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 45%,#242424 0%,#0b0b0b 35%,#020202 75%);
}

/* TOP */

.nav{
    position:absolute;
    top:30px;
    left:0;
    width:100%;
    padding:0 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:5;
}

.logo{
    font-size:18px;
    font-weight:bold;
    letter-spacing:7px;
}

.menu{
    width:38px;
    height:38px;
    border:1px solid #444;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
}

/* BIG TEXT */

.background-text{
    position:absolute;
    font-size:clamp(100px,22vw,300px);
    font-weight:900;
    letter-spacing:-15px;
    color:rgba(255,255,255,0.025);
    user-select:none;
}

/* CONTENT */

.content{
    position:relative;
    z-index:2;
    text-align:center;
}

.small-title{
    font-size:11px;
    letter-spacing:6px;
    opacity:.55;
    margin-bottom:18px;
}

.number{
    font-size:clamp(120px,25vw,260px);
    line-height:.8;
    font-weight:900;
    letter-spacing:-15px;
    background:linear-gradient(
        180deg,
        #ffffff,
        #777777 55%,
        #222222
    );
    -webkit-background-clip:text;
    color:transparent;
    text-shadow:0 15px 40px rgba(0,0,0,.8);
}

/* RED LIGHT */

.red-line{
    width:160px;
    height:2px;
    background:#e00000;
    margin:35px auto 25px;
    box-shadow:
        0 0 10px #e00000,
        0 0 30px rgba(224,0,0,.5);
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:.4;
        transform:scaleX(.7);
    }

    50%{
        opacity:1;
        transform:scaleX(1.2);
    }
}

/* BUTTON */

.start{
    position:relative;
    padding:16px 38px;
    background:transparent;
    color:white;
    border:1px solid #555;
    cursor:pointer;
    font-size:10px;
    letter-spacing:5px;
    transition:.35s;
    overflow:hidden;
}

.start::before{
    content:"";
    position:absolute;
    left:-100%;
    top:0;
    width:100%;
    height:100%;
    background:white;
    transition:.35s;
    z-index:-1;
}

.start:hover{
    color:#000;
    border-color:white;
}

.start:hover::before{
    left:0;
}

/* BOTTOM */

.bottom{
    position:absolute;
    bottom:30px;
    left:0;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    opacity:.4;
    font-size:9px;
    letter-spacing:3px;
}

.dot{
    width:5px;
    height:5px;
    background:#e00000;
    border-radius:50%;
    box-shadow:0 0 10px #e00000;
}

/* SIDE DETAILS */

.side-left{
    position:absolute;
    left:7%;
    bottom:28%;
    writing-mode:vertical-rl;
    font-size:8px;
    letter-spacing:4px;
    opacity:.25;
}

.side-right{
    position:absolute;
    right:7%;
    bottom:28%;
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    font-size:8px;
    letter-spacing:4px;
    opacity:.25;
}

/* MOBILE */

@media(max-width:600px){

    .nav{
        padding:0 6%;
    }

    .logo{
        font-size:14px;
        letter-spacing:5px;
    }

    .number{
        font-size:150px;
    }

    .background-text{
        font-size:120px;
    }

    .side-left,
    .side-right{
        display:none;
    }
}
</style>
</head>

<body>

<section class="hero">

    <div class="nav">
        <div class="logo">PORSCHE</div>
        <div class="menu">+</div>
    </div>

    <div class="background-text">
        911
    </div>

    <div class="side-left">
        PERFORMANCE • PRECISION • PASSION
    </div>

    <div class="side-right">
        NIGHT DRIVE EXPERIENCE
    </div>

    <div class="content">

        <div class="small-title">
            THE NIGHT DRIVE EXPERIENCE
        </div>

        <div class="number">
            911
        </div>

        <div class="red-line"></div>

        <button class="start" onclick="startEngine()">
            START ENGINE
        </button>

    </div>

    <div class="bottom">
        <span class="dot"></span>
        SCROLL TO ENTER
    </div>

</section>

<script>

function startEngine(){

    const button = document.querySelector(".start");

    button.innerHTML = "ENGINE STARTED";

    button.style.background = "white";
    button.style.color = "black";
    button.style.borderColor = "white";

    setTimeout(function(){

        button.innerHTML = "NIGHT DRIVE";

    },1200);
}

</script>

</body>
</html>
